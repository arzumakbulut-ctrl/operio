version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: operio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     operio
      POSTGRES_PASSWORD: operio_secret
      POSTGRES_DB:       operio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operio -d operio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (isteğe bağlı görsel arayüz) ─────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: operio_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@operio.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools  # sadece: docker compose --profile tools up

  # ── Speaker-ID (iç ağ, dışa port açılmaz) ────────────────
  speaker-id:
    build:
      context: ./speaker-id-service
    container_name: operio_speaker_id
    restart: unless-stopped
    # Final whole-branch review finding #3: GET /health, modül import
    # zamanında ECAPA-TDNN modeli başarıyla yüklendiğinde 200 döner (bkz.
    # app.py). curl image'da YOK (sadece ffmpeg kurulu) — image'da zaten
    # bulunan python'ın kendi urllib'i ile aynı işi yapıyoruz, ek paket
    # kurmaya gerek kalmıyor. start_period, torch/model başlatma süresine
    # (ilk istekten önceki soğuk başlangıç) pay bırakır.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── Operio API ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operio_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://operio:operio_secret@postgres:5432/operio_db
      NODE_ENV: production
      SPEAKER_ID_SERVICE_URL: http://speaker-id:8001
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      speaker-id:
        condition: service_started
    command: >
      sh -c "
        psql \"$$DATABASE_URL\" -f migrations/001_init.sql &&
        psql \"$$DATABASE_URL\" -f migrations/002_platform_admin.sql &&
        node prisma/seed.js &&
        node src/server.js
      "

volumes:
  postgres_data:
